<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Ankit - AI Prompt Studio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">🚀 Hacker Ankit AI Studio</div>
        <input type="text" id="searchInput" placeholder="Search viral AI prompts..." onkeyup="filterPrompts()">
    </header>

    <main>
        <h1 class="heading">🔥 Top Trending Viral AI Prompts</h1>
        <div id="promptContainer" class="prompt-grid">
            <!-- Prompts will be dynamically generated here -->
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
