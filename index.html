<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER ANKIT - 600+ Trending AI Prompts Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- INTRO ANIMATION SCREEN --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #040407;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .glitch-title {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 40px #0088ff;
            animation: textPulse 2s infinite alternate;
            margin-bottom: 25px;
        }

        @keyframes textPulse {
            0% { text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
            100% { text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f; color: #ff007f; }
        }

        .demo-animation-container {
            width: 85%;
            max-width: 650px;
            height: 220px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            position: relative;
            margin-bottom: 30px;
            background: #111;
        }

        .demo-slider {
            display: flex;
            width: 300%;
            height: 100%;
            animation: slideDemo 9s infinite ease-in-out;
        }

        .demo-slide {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .demo-text {
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 25px;
            border-radius: 8px;
            border: 1px solid #00ffcc;
            color: #fff;
        }

        @keyframes slideDemo {
            0%, 30% { transform: translateX(0%); }
            33%, 63% { transform: translateX(-33.33%); }
            66%, 96% { transform: translateX(-66.66%); }
        }

        .enter-btn {
            padding: 16px 42px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #000;
            background: #00ffcc;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px #00ffcc;
            transition: all 0.3s ease;
        }

        .enter-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 30px #ff007f;
            transform: scale(1.05);
        }

        /* --- MAIN DASHBOARD --- */
        header {
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
            background: #0b0b10;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: #00ffcc;
            margin-bottom: 15px;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        .search-box {
            width: 90%;
            max-width: 600px;
            padding: 14px 22px;
            border-radius: 25px;
            border: 1px solid #333;
            background: #161622;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-box:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .main-container {
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
        }

        .card {
            background: #12121c;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #222;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #00ffcc;
        }

        .card-img-preview {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #1a1a26;
            display: block;
        }

        .card-body {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .prompt-tag {
            font-size: 0.78rem;
            font-weight: bold;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .prompt-text {
            font-size: 0.88rem;
            color: #ddd;
            margin-bottom: 18px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background: #1a1a2a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .copy-btn:hover {
            background: #00ffcc;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- INTRO ANIMATION SCREEN -->
    <div id="intro-screen">
        <h1 class="glitch-title">HACKER ANKIT</h1>
        
        <div class="demo-animation-container">
            <div class="demo-slider">
                <div class="demo-slide">
                    <div class="demo-text">1. Copy Viral AI Photo Prompts</div>
                </div>
                <div class="demo-slide">
                    <div class="demo-text">2. Paste in Gemini / Bing AI</div>
                </div>
                <div class="demo-slide">
                    <div class="demo-text">3. Create 600+ HD Photos Instantly</div>
                </div>
            </div>
        </div>

        <button class="enter-btn" onclick="enterWebsite()">EXPLORE 600+ TRENDING PROMPTS</button>
    </div>

    <!-- MAIN WEBSITE -->
    <header>
        <h1>HACKER ANKIT AI STUDIO</h1>
        <input type="text" class="search-box" id="searchInput" onkeyup="filterPrompts()" placeholder="Search 600+ Prompts (Bike, Couple, Mirror Selfie, Outfit)...">
    </header>

    <div class="main-container">
        <div class="grid" id="promptGrid"></div>
    </div>

    <script>
        let allPrompts = [];

        function enterWebsite() {
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
            }, 800);
        }

        // Pinterest/Instagram Viral Categories and Image Keywords
        const categoryData = [
            { name: "Outfit Swap & Identity", query: "fashion,man,model,style" },
            { name: "Royal Bike & Supercar", query: "motorbike,motorcycle,supercar,biker" },
            { name: "Traditional Couple Saree", query: "saree,couple,indian,wedding" },
            { name: "Aesthetic Mirror Selfie", query: "portrait,selfie,aesthetic,neon" },
            { name: "3D Chibi & Avatar", query: "3d,character,cute,avatar" },
            { name: "Beach Sunset & Sad Vibes", query: "beach,sunset,alone,ocean" },
            { name: "Cyberpunk Neon Wings", query: "cyberpunk,neon,wings,futuristic" },
            { name: "Retro Vintage Polaroid", query: "vintage,retro,camera,film" }
        ];

        const promptTemplates = [
            "Use my uploaded image as base. Keep face identity, pose, body shape, background, and lighting exact. Replace current outfit with modern classy menswear. Ultra-realistic 8k details.",
            "Handsome young Indian boy sitting on a matte black Royal Enfield Bullet, wearing black jacket and dark sunglasses, street background, cinematic dramatic lighting, 8k resolution.",
            "Romantic couple portrait in lush green garden. Boy in maroon designer kurta and girl in matching elegant red saree, natural sunlight, highly detailed skin texture.",
            "Trendy boy taking mirror selfie with smartphone, wearing oversized aesthetic shirt, dark room background with bold motivational typography neon text on wall.",
            "Realistic portrait of stylish young man with a cute miniature 3D animated chibi avatar of himself sitting on his shoulder, viral Instagram edit style.",
            "Young boy standing on serene ocean beach at sunset holding white roses, dramatic blue hour lighting, cinematic aesthetic film look.",
            "3D artwork of a young boy sitting on obsidian throne with glowing neon wings behind him, cyberpunk futuristic background, dramatic lighting.",
            "1990s retro vintage film aesthetic portrait of a stylish boy sitting in cozy aesthetic cafe, warm amber lighting, subtle film grain texture."
        ];

        // Generator to Build 600 UNIQUE Prompts & Real Images
        function build600UniqueItems() {
            const list = [];
            for (let i = 1; i <= 600; i++) {
                const catIdx = (i - 1) % categoryData.length;
                const templateIdx = (i - 1) % promptTemplates.length;
                
                const currentCat = categoryData[catIdx];
                
                // Real Image Dynamic URL with unique seed for 600 DIFFERENT HD images
                const imageUrl = `https://source.unsplash.com/featured/600x600/?${currentCat.query}&sig=${i}`;

                const variationText = [
                    "Ultra-realistic photo edit, studio quality portrait lighting.",
                    "Cinematic 8k resolution with soft dramatic shadow tones.",
                    "Moody blue hour outdoor lighting, highly detailed skin texture.",
                    "Aesthetic vintage color grading with crisp 4k details.",
                    "Trending Instagram reel aesthetic style, perfect face accuracy."
                ][(i - 1) % 5];

                list.push({
                    id: i,
                    category: currentCat.name,
                    prompt: `${promptTemplates[templateIdx]} (Variation #${i}): ${variationText}`,
                    image: imageUrl
                });
            }
            return list;
        }

        allPrompts = build600UniqueItems();

        function renderCards(data) {
            const grid = document.getElementById('promptGrid');
            grid.innerHTML = '';

            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <img class="card-img-preview" src="${item.image}" alt="Prompt #${item.id} Preview" loading="lazy" onerror="this.src='https://picsum.photos/seed/${item.id}/600/600'">
                    <div class="card-body">
                        <div class="prompt-tag">#${item.id} - ${item.category}</div>
                        <p class="prompt-text">${item.prompt}</p>
                        <button class="copy-btn" onclick="copyText(\`${item.prompt.replace(/`/g, '\\`')}\`, this)">COPY PROMPT</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Render All 600 Cards Immediately
        renderCards(allPrompts);

        function copyText(text, btn) {
            navigator.clipboard.writeText(text);
            const originalText = btn.innerText;
            btn.innerText = "COPIED! ✓";
            btn.style.background = "#00ffcc";
            btn.style.color = "#000";
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "#1a1a2a";
                btn.style.color = "#00ffcc";
            }, 2000);
        }

        function filterPrompts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPrompts.filter(item => 
                item.prompt.toLowerCase().includes(query) || 
                item.category.toLowerCase().includes(query)
            );
            renderCards(filtered);
        }
    </script>
</body>
</html>
